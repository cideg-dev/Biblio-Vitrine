<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — CIDEG & P.line</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="assets/images/Lumiere_sur_parole.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .error-page h1 { font-size: 8rem; font-family: var(--font-display); background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 0.5rem; }
        .error-page h2 { font-size: 1.5rem; margin-bottom: 0.8rem; }
        .error-page p { color: var(--text2); margin-bottom: 2rem; max-width: 400px; margin-left: auto; margin-right: auto; }
        .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <h1>404</h1>
            <h2>Page introuvable</h2>
            <p>La page que vous cherchez n'existe pas ou a été déplacée. Mais la Parole de Dieu, elle, reste éternelle.</p>
            <div class="error-actions">
                <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Accueil</a>
                <a href="index.html#bibliotheque" class="btn-outline"><i class="fas fa-book-open"></i> Bibliothèque</a>
                <a href="missions.html" class="btn-outline"><i class="fas fa-hand-holding-heart"></i> Mission</a>
            </div>
            <p style="margin-top:2rem;font-size:0.8rem;color:var(--text3)">« Ta parole est une lampe à mes pieds. » — Psaume 119:105</p>
        </div>
    </div>
</body>
</html>
